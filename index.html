<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Instrument and Level</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
  <div class="flex-grow flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md space-y-6">
    <h1 class="text-2xl font-bold text-center">Start Fingering Practice</h1>

    <!-- Instrument Selection -->
    <div>
      <label for="instrument-select" class="block font-semibold mb-1">Select Instrument:</label>
      <select id="instrument-select" class="w-full border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        <option value="Flute">Flute</option>
        <option value="Oboe">Oboe</option>
        <option value="Bassoon">Bassoon</option>
        <option value="Clarinet">Clarinet</option>
        <option value="Bass_Clarinet">Bass Clarinet</option>
        <option value="Alto_Sax">Alto Sax</option>
        <option value="Tenor_Sax">Tenor Sax</option>
        <option value="Bari_Sax">Bari Sax</option>
        <option value="Trumpet">Trumpet</option>
        <option value="Single_Horn">Single French Horn</option>
        <option value="Double_Horn">Double French Horn</option>
        <option value="Trombone">Trombone</option>
        <option value="Baritone_BC">Baritone BC</option>
        <option value="Baritone_TC">Baritone TC</option>
        <option value="Tuba">Tuba</option>
        <option value="Bass_Guitar">Bass Guitar</option>
        <option value="Percussion">Percussion</option>
      </select>
    </div>

    <!-- Level Selection -->
    <div id="levelTypeSelect" class="flex justify-between items-center">
      <label class="flex items-center gap-2">
        <input type="radio" id="levels" name="level-type" value="level" checked>
        <span>Levels</span>
      </label>

      <label class="flex items-center gap-2">
        <input type="radio" id="scales" name="level-type" value="scale">
        <span>Scales</span>
      </label>

      <label class="flex items-center gap-2">
        <input type="radio" id="custom" name="level-type" value="custom">
        <span>Custom</span>
      </label>
    </div>

    <div id="level-options" class="hidden">
      <label for="level-select" class="block font-semibold mb-1">Select Level:</label>
      <select id="level-select" class="w-full border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"></select>
    </div>

    <div id="scale-options" class="hidden">
      <div class="grid gap-4" style="grid-template-columns: 40% 60%;">
        <label for="keyCenter" class="block font-semibold mb-1">Key (concert pitch):</label>
        <label for="scaleType" class="block font-semibold mb-1">Scale Type:</label>

        <select id="keyCenter" class="w-full border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"></select>
        <select id="scaleType" class="w-full border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"></select>
      </div>
    </div>

    <div id="custom-options" class="hidden space-y-4">
      <div>
        <label for="custom-clef" class="block font-semibold mb-1">Clef:</label>
        <select id="custom-clef" class="w-full border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
          <option value="treble">Treble</option>
          <option value="bass">Bass</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="custom-low" class="block font-semibold mb-1">Lowest Note:</label>
          <select id="custom-low" class="w-full border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"></select>
        </div>
        <div>
          <label for="custom-high" class="block font-semibold mb-1">Highest Note:</label>
          <select id="custom-high" class="w-full border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"></select>
        </div>
      </div>

      <div>
        <label for="custom-key" class="block font-semibold mb-1">Key (written pitch):</label>
        <select id="custom-key" class="w-full border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"></select>
      </div>

      <div>
        <span class="block font-semibold mb-1">Display:</span>
        <div class="flex gap-6">
          <label class="flex items-center gap-2">
            <input type="radio" name="custom-display" value="keySignature" checked>
            <span>Key Signature</span>
          </label>
          <label class="flex items-center gap-2">
            <input type="radio" name="custom-display" value="accidentals">
            <span>Accidentals</span>
          </label>
        </div>
      </div>

      <p class="text-sm text-gray-600">Custom range uses written notes. The selected key determines the sharp/flat notes inside that range.</p>
    </div>

    <!-- Timer + Target Row -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="timer-select" class="block font-semibold mb-1">Time Limit:</label>
        <select id="timer-select" class="w-full border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
          <option value="60" selected>1 min</option>
          <option value="120">2 min</option>
          <option value="180">3 min</option>
          <option value="300">5 min</option>
        </select>
      </div>

      <div>
        <label for="target-number" class="block font-semibold mb-1">Goal:</label>
        <input id="target-number" type="number" min="1" max="100" step="1" value="25"
          class="w-full border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"
          placeholder="e.g. 20" />
      </div>
    </div>

    <button onclick="startPractice()"
      class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-blue-700 transition">
      GO!
    </button>
  </div>
  </div>

  <footer class="bg-gray-600 text-white text-center p-3">
    <span>v 2.0</span>
  </footer>

  <script>
    function getSelectedLevel() {
      const selectedType = document.querySelector('input[name="level-type"]:checked');
      if (!selectedType || selectedType.value === "level") {
        return document.getElementById("level-select").value;
      }
      if (selectedType.value === "scale") {
        const key = document.getElementById("keyCenter").value;
        const scaleType = document.getElementById("scaleType").value;
        return scaleType === "Chromatic" ? "Chromatic Scale" : `${key} ${scaleType}`;
      }
      return "Custom";
    }

    function startPractice() {
      const instrument = document.getElementById("instrument-select").value;
      const level = getSelectedLevel();
      const timer = document.getElementById("timer-select").value;
      const target = document.getElementById("target-number").value;
      const selectedType = document.querySelector('input[name="level-type"]:checked')?.value;
      const search = new URLSearchParams({ instrument, level, timer, target });

      if (selectedType === 'custom') {
        search.set('custom', '1');
        search.set('clef', document.getElementById('custom-clef').value);
        search.set('low', document.getElementById('custom-low').value);
        search.set('high', document.getElementById('custom-high').value);
        search.set('key', document.getElementById('custom-key').value);
        search.set('display', document.querySelector('input[name="custom-display"]:checked').value);
      }

      window.location.href = `fingering-practice.html?${search.toString()}`;
    }

    const levelRadio = document.getElementById("levels");
    const scalesRadio = document.getElementById("scales");
    const customRadio = document.getElementById("custom");
    const levelOptions = document.getElementById("level-options");
    const scaleOptions = document.getElementById("scale-options");
    const customOptions = document.getElementById("custom-options");

    function updateSelectionDisplay() {
      levelOptions.classList.add("hidden");
      scaleOptions.classList.add("hidden");
      customOptions.classList.add("hidden");
      if (levelRadio.checked) levelOptions.classList.remove("hidden");
      if (scalesRadio.checked) scaleOptions.classList.remove("hidden");
      if (customRadio.checked) customOptions.classList.remove("hidden");
    }

    [levelRadio, scalesRadio, customRadio].forEach(radio => radio.addEventListener("change", updateSelectionDisplay));
    updateSelectionDisplay();
  </script>
  <script src="js/scales.js"></script>
  <script src="js/instrument-builder.js"></script>
  <script src="js/selection.js"></script>
</body>
</html>
